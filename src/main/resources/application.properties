# Puerto de la aplicación Java
server.port=8080

# Configuración de Base de Datos (entorno local fuera de Docker o por defecto)
spring.datasource.url=jdbc:mysql://localhost:3306/tiendadb?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=usuario
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# "validate" comprueba que las entidades Java coincidan con las tablas creadas por el script SQL (schema.sql)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect