# Puerto de la aplicación Java
server.port=8080

# Configuración de Base de Datos (entorno local fuera de Docker o por defecto)
spring.datasource.url=jdbc:mysql://db:3306/tiendadb?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always

# JPA / Hibernate
# "validate" comprueba que las entidades Java coincidan con las tablas creadas por el script SQL (schema.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Permite que SpringDoc escanee automáticamente los controladores Java
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html