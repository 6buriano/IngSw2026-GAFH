version: '3.8'

services:
  app:
    image: nginx:alpine  # Usa una imagen preconstruida en lugar de compilar
    ports:
      - "3000:80"        # Expone la página web en el puerto 3000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped
