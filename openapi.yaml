openapi: 3.0.3
info:
  title: API Tienda - Productos y Ordenes
  description: >
    API REST para la gestión de Productos y Ordenes de compra de un local
    que vende de forma presencial y por Web. Estilo arquitectónico de
    Microservicios: este documento cubre el recurso Productos (endpoint
    PATCH) y el recurso Ordenes (GET, GET por id, GET detalle, POST).
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Entorno local (Docker)

tags:
  - name: Productos
    description: Gestión del catálogo de productos
  - name: Ordenes
    description: Gestión de órdenes de compra

paths:

  # ---------------------------------------------------------------------
  # v. PATCH /api/productos/{id}
  # ---------------------------------------------------------------------
  /api/productos/{id}:
    patch:
      tags:
        - Productos
      summary: Actualizar parcialmente un producto
      description: >
        Actualiza uno o varios campos de un producto existente sin
        necesidad de enviar el recurso completo (a diferencia de PUT).
      operationId: patchProducto
      parameters:
        - $ref: '#/components/parameters/ProductoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoPatch'
            example:
              precioUnitario: 1199.99
              stock: 20
      responses:
        '200':
          description: Producto actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
              example:
                mensaje: "Producto actualizado correctamente"
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El producto no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                mensaje: "Producto con id 1 no encontrado"

  # ---------------------------------------------------------------------
  # vi. GET /api/ordenes   ix. POST /api/ordenes
  # ---------------------------------------------------------------------
  /api/ordenes:
    get:
      tags:
        - Ordenes
      summary: Listar órdenes
      description: >
        Devuelve la lista de órdenes con sus datos generales y, para cada
        una, la lista de productos (identificador) y cantidad pedidos.
      operationId: getOrdenes
      responses:
        '200':
          description: Lista de órdenes obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Orden'

    post:
      tags:
        - Ordenes
      summary: Crear una orden de compra
      description: >
        Crea una nueva orden. Se verifica que cada producto solicitado
        exista y que tenga stock suficiente para la cantidad pedida.
      operationId: crearOrden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenInput'
            example:
              email: "cliente@email.com"
              direccionEnvio: "Av. Italia 3333, Maldonado"
              telefono: "+59899111222"
              productos:
                - productoId: 1
                  cantidad: 2
                - productoId: 2
                  cantidad: 5
      responses:
        '201':
          description: Orden creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenCreadaResponse'
              example:
                id: 1001
        '400':
          description: Solicitud inválida (datos faltantes o mal formados)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Conflicto: stock insuficiente para algún producto solicitado,
            o alguno de los productos indicados no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                mensaje: "Stock insuficiente para el producto 2"

  # ---------------------------------------------------------------------
  # vii. GET /api/ordenes/{id}
  # ---------------------------------------------------------------------
  /api/ordenes/{id}:
    get:
      tags:
        - Ordenes
      summary: Obtener una orden por id
      operationId: getOrdenById
      parameters:
        - $ref: '#/components/parameters/OrdenId'
      responses:
        '200':
          description: Orden encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orden'
        '404':
          description: La orden no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                mensaje: "Orden con id 1001 no encontrada"

  # ---------------------------------------------------------------------
  # viii. GET /api/ordenes/{id}/detalle
  # ---------------------------------------------------------------------
  /api/ordenes/{id}/detalle:
    get:
      tags:
        - Ordenes
      summary: Obtener el detalle completo de una orden
      description: >
        Devuelve los datos de la orden y, para cada producto solicitado,
        el detalle completo del producto (nombre, descripción, precio,
        stock, imágenes), no solo su identificador.
      operationId: getOrdenDetalle
      parameters:
        - $ref: '#/components/parameters/OrdenId'
      responses:
        '200':
          description: Detalle de la orden encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenDetalle'
        '404':
          description: La orden no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                mensaje: "Orden con id 1001 no encontrada"

components:

  parameters:
    ProductoId:
      name: id
      in: path
      required: true
      description: Identificador del producto
      schema:
        type: integer
        format: int64
        example: 1

    OrdenId:
      name: id
      in: path
      required: true
      description: Identificador de la orden
      schema:
        type: integer
        format: int64
        example: 1001

  schemas:

    # --- Productos -------------------------------------------------
    Producto:
      type: object
      description: Producto del catálogo (definido en detalle en las rutas i-iv)
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Notebook Lenovo ThinkPad"
        descripcion:
          type: string
          example: "Notebook Intel i7 16GB RAM"
        precioUnitario:
          type: number
          format: double
          example: 1250.50
        stock:
          type: integer
          example: 15
        imagenes:
          type: array
          items:
            type: string
            format: uri
          example:
            - "https://ejemplo.com/img/notebook-1.jpg"
            - "https://ejemplo.com/img/notebook-2.jpg"

    ProductoPatch:
      type: object
      description: >
        Campos a modificar de un producto. Todos son opcionales:
        se envían únicamente los que se quieren actualizar.
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        precioUnitario:
          type: number
          format: double
        stock:
          type: integer
        imagenes:
          type: array
          items:
            type: string
            format: uri
      minProperties: 1

    # --- Ordenes -----------------------------------------------------
    OrdenProductoItem:
      type: object
      description: Referencia a un producto pedido dentro de una orden
      required:
        - productoId
        - cantidad
      properties:
        productoId:
          type: integer
          format: int64
          example: 1
        cantidad:
          type: integer
          minimum: 1
          example: 2

    OrdenDetalleItem:
      type: object
      description: Producto pedido con todos sus datos (para /detalle)
      properties:
        producto:
          $ref: '#/components/schemas/Producto'
        cantidad:
          type: integer
          minimum: 1
          example: 2

    Orden:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        email:
          type: string
          format: email
          example: "cliente@email.com"
        direccionEnvio:
          type: string
          example: "Av. Italia 3333, Maldonado"
        telefono:
          type: string
          example: "+59899111222"
        estado:
          type: string
          description: Estado actual del pedido
          example: "Created"
        fechaCreacion:
          type: string
          format: date-time
          example: "2026-06-21T14:30:00-03:00"
        productos:
          type: array
          items:
            $ref: '#/components/schemas/OrdenProductoItem'

    OrdenInput:
      type: object
      description: Datos requeridos para crear una nueva orden
      required:
        - email
        - direccionEnvio
        - telefono
        - productos
      properties:
        email:
          type: string
          format: email
          example: "cliente@email.com"
        direccionEnvio:
          type: string
          example: "Av. Italia 3333, Maldonado"
        telefono:
          type: string
          example: "+59899111222"
        productos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrdenProductoItem'

    OrdenDetalle:
      type: object
      description: Orden junto con el detalle completo de cada producto pedido
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        email:
          type: string
          format: email
        direccionEnvio:
          type: string
        telefono:
          type: string
        estado:
          type: string
          example: "Created"
        fechaCreacion:
          type: string
          format: date-time
        productos:
          type: array
          items:
            $ref: '#/components/schemas/OrdenDetalleItem'

    OrdenCreadaResponse:
      type: object
      description: Respuesta al crear una orden exitosamente
      properties:
        id:
          type: integer
          format: int64
          description: Identificador de la orden generada
          example: 1001

    # --- Genéricos -----------------------------------------------------
    MensajeResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "Operación realizada correctamente"

    ErrorResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "Descripción del error ocurrido"
